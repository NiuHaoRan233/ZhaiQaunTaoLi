[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "zhaiquant"
version = "0.1.0"
description = "Read-only MiniQMT recorder, bond and commodity-option research, and paper-only strategies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.5.2",
  "pandas==3.0.5",
  "xtquant==250807.1.2",
]

[project.optional-dependencies]
research = [
  "matplotlib==3.11.1",
]
ocr = [
  "rapidocr-onnxruntime==1.4.4",
]

[project.scripts]
zhaiquant = "zhaiquant.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
