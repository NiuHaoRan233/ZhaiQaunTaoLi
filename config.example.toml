[qmt]
port = 58611
bond_code = "132026.SH"
stock_code = "600900.SH"
# Extra instruments are recorded in full but are not traded by M0.  The
# second bond's own underlying stock is required for causal maker replay.
watch_codes = ["132024.SH", "600362.SH"]
instrument_names = { "132026.SH" = "G三峡EB2", "132024.SH" = "26江铜EB", "600362.SH" = "江西铜业" }
callback_queue_size = 100000
stale_after_seconds = 3.0
status_interval_seconds = 15.0

[storage]
database = "data/zhaiquant.sqlite3"
commit_every_rows = 100
commit_every_seconds = 1.0
store_raw_json = true

[m0]
rolling_observations = 1200
minimum_observations = 600
entry_discount = 0.008
exit_discount = 0.001
maximum_sync_seconds = 3.0
earliest_entry = "09:35:00"
latest_entry = "14:30:00"
force_exit = "14:55:00"
maximum_holding_minutes = 60
cooldown_minutes = 10
trading_enabled = true

[[m0.conversion_prices]]
effective_date = "2020-01-01"
price = 22.20

[[m0.conversion_prices]]
effective_date = "2026-02-12"
price = 21.99

[[m0.conversion_prices]]
effective_date = "2026-07-17"
price = 21.20

[paper]
enabled = true
notional_cny = 100000.0
# Order/fill/position quantities are bonds; MiniQMT bond book volumes are hands (10 bonds).
quantity_bonds = 100.0
price_tick = 0.001
maker_entry_wait_seconds = 60
maker_exit_wait_seconds = 180
standing_reprice_ticks = 5
standing_reprice_seconds = 10.0
execution_models = ["E1", "E2", "E3", "E4"]
fill_modes = ["optimistic", "queue", "conservative"]

[maker_paper]
# Paper only: never sends broker orders. Starts each day with 1,000 bonds plus
# enough cash for another 1,000, and keeps inventory between 0 and 2,000.
enabled = false
bond_codes = ["132026.SH", "132024.SH"]
underlying_stock_codes = { "132026.SH" = "600900.SH", "132024.SH" = "600362.SH" }
initial_inventory_bonds = 1000.0
additional_buying_capacity_bonds = 1000.0
maximum_inventory_bonds = 2000.0
# Legacy CNY ledger seed. Standard maker accounts use the explicit bond
# capacity above and neutrally increase this funding base if actual prices
# require more cash; the independent windfall account remains cash-limited.
initial_cash_cny = 136800.0
order_quantity_bonds = 1000.0
price_tick = 0.001
fill_modes = ["priority", "queue"]
# Optional candidate models that run beside the baselines in real time. Each
# uses an independent account and persists all paper orders/fills to SQLite.
realtime_comparison_model_ids = [
  "maker_priority_v1_37_candidate",
  "maker_priority_v1_43_candidate",
  "maker_queue_v1_17_candidate",
]
earliest_entry = "09:30:00.000"
latest_entry = "15:29:59.999"
# Optional independent one-hand paper account for extreme deep-book bargains.
super_windfall_enabled = false
super_windfall_quantity_bonds = 10.0
super_windfall_credit_cny = 2000.0
